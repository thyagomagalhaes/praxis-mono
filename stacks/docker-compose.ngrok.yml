version: '3.8'

services:
    # The ngrok tunnel service
  ngrok-infra:
    image: ngrok/ngrok:latest
    container_name: ngrok-tunnel-webhooks
    env_file: 
      - .env
    restart: unless-stopped
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
    # Command format: http <service_name>:<internal_port>
    command: http nginx-infra:${NGINX_HTTP_CONTAINER}
    ports:
#      - "4040:4040" # Opens the local ngrok web dashboard
      - "${NGROK_DASHBOARD_HOST}:${NGROK_DASHBOARD_CONTAINER}"
    depends_on:
      nginx-infra:
        condition: service_healthy
    networks:
      - praxis-network

networks:
    praxis-network:
        name: praxis-network
        driver: bridge
