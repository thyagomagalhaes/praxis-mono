services:
    # The ngrok tunnel service
  ngrok:
    image: ngrok/ngrok:latest
    container_name: ngrok  
    deploy:
      resources:
        reservations:
          cpus: '0.15'
          memory: 64M
        limits:
          cpus: '0.50'        # Limita a metade de 1 núcleo
          memory: 128M        # Margem segura para picos de conexões   
    env_file: 
      - .env
    restart: unless-stopped
    environment:
      - NGROK_AUTHTOKEN=${NGROK_TOKEN}  
    # Command format: http <service_name>:<internal_port>
    # command: http nginx-infra:${NGINX_HTTP_CONTAINER}
    command: ["http", "--hostname", "${NGROK_PUBLIC_DOMAIN}", "nginx:${NGINX_HTTP_CONTAINER}"]
    ports:
      # Opens the local ngrok web dashboard
      - "${NGROK_DASHBOARD_HOST}:${NGROK_DASHBOARD_CONTAINER}"
    depends_on:
      nginx:
        condition: service_healthy
    networks:
      - suasflux-network

networks:
    suasflux-network:
        name: suasflux-network
        driver: bridge
