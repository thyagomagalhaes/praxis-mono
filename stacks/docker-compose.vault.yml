services:
  vault:
    image: hashicorp/vault:1.16  # Using a standard, well-supported LTS version
    container_name: vault
    restart: unless-stopped
    ports:
      - "8200:8200"
    networks:
      - suasflux-network
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: "dev-root-token"  # Predictable token for development
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"     # Listen on all interfaces inside container
      VAULT_ADDR: "http://127.0.0.1:8200"
    
    # Required for Vault to lock memory pages and prevent swapping secrets to disk
    cap_add:
      - IPC_LOCK
    
    # Alternative to cap_add if your Docker host environment restricts IPC_LOCK
    # environment:
    #   - VAULT_DISABLE_MLOCK=true

    # 1. Health Check Configuration
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

    # 2. Resource Limits & Deploy Profiles
    deploy:
      resources:
        limits:
          cpus: '0.50'      # Cap CPU usage at 50% of a single core
          memory: 512M      # Maximum memory hard limit
        reservations:
          cpus: '0.10'      # Minimum CPU guaranteed
          memory: 256M      # Minimum memory guaranteed

    # 3. System Ulimits for high concurrent dev connections
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
        
networks:
    suasflux-network:
        name: suasflux-network
        driver: bridge
