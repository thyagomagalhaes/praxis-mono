services:
  redis:
    image: redis:8.2
    container_name: redis-dev
    restart: unless-stopped
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    ports:
      - "${REDIS_HOST}:${REDIS_CONTAINER}"
    volumes:
      - ../redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - redis_data_dev:/data
    networks:
      - praxis-network

  redisinsight:
    image: redis/redisinsight:latest
    container_name: redisinsight-dev
    restart: unless-stopped
    ports:
      - "5540:5540"
    depends_on:
      - redis
    networks:
      - praxis-network
    volumes:
      - redisinsight_data_dev:/data
    environment:
      - RI_APP_FEATURES=browser,database_analysis,workbench
      - REDISINSIGHT_CONNECTIONS=[{"name":"Local Redis","host":"redis","port":6379,"username":"","password":"q52ma/BY7Z+4mJAucRLoQ/HiwbC3g3QGMOM1aj+twAqjZrPRhet2C6AguHtEVKvgnAIuqedC1kinDsaW"}]

networks:
  praxis-network:
    name: praxis-network

volumes:
  redis_data_dev:
  redisinsight_data_dev:
