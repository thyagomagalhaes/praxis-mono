# Desativa a autoconfiguração padrão do Flyway para controlarmos os varios bancos via Java
spring.flyway.enabled=false
# configuração customizada dos banco de dados
app.datasource.acolhimento.url: jdbc:postgresql://localhost:5432/db_msacolhimento
app.datasource.acolhimento.username:postgres
app.datasource.acolhimento.password:postgres_password
app.datasource.acolhimento.driver-class-name: org.postgresql.Driver
# flyway locations for baseline migration scripts and callback lifecycle scripts
app.datasource.acolhimento.flyway.locations: classpath:db/setupschema/acolhimento,classpath:db/migration/acolhimento,classpath:db/legacydata/acolhimento

