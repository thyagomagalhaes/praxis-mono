# ============================================================
# SUAFLUX PREM - STAGING (HML)
# Ambiente de homologação / staging
# Host: Ubuntu 26.04 LTS | 4 cores | 12GB RAM
# ============================================================

name: suasflux-prem-hml

services:
  # --------------------------------------------------
  # MYSQL 8.0
  # --------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: mysql-suasflux-prem-hml
    restart: unless-stopped
    environment:
      TZ: ${TZ:-America/Recife}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-keycloak_db}
      MYSQL_USER: ${MYSQL_USER:-keycloak_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - suasflux-prem-hml
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '0.75'
          memory: 1.5G
        reservations:
          cpus: '0.50'
          memory: 512M

  # --------------------------------------------------
  # POSTGRESQL 16
  # --------------------------------------------------
  postgres:
    image: postgres:16.4
    container_name: postgres-suasflux-prem-hml
    restart: unless-stopped
    environment:
      TZ: ${TZ:-America/Recife}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-suasflux_hml}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - suasflux-prem-hml
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-suasflux_hml}"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '0.75'
          memory: 1.5G
        reservations:
          cpus: '0.50'
          memory: 512M

  # --------------------------------------------------
  # REDIS 7.4
  # --------------------------------------------------
  redis:
    image: redis:7.4
    container_name: redis-suasflux-prem-hml
    restart: unless-stopped
    environment:
      TZ: ${TZ:-America/Recife}
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - suasflux-prem-hml
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

  # --------------------------------------------------
  # MONGODB 7.0
  # --------------------------------------------------
  mongodb:
    image: mongo:7.0
    container_name: mongodb-suasflux-prem-hml
    restart: unless-stopped
    environment:
      TZ: ${TZ:-America/Recife}
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - suasflux-prem-hml
    healthcheck:
      test: echo 'db.runCommand({ping: 1}).ok' | mongosh localhost:27017/test --quiet
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '0.75'
          memory: 1.5G
        reservations:
          cpus: '0.50'
          memory: 512M

  # --------------------------------------------------
  # RABBITMQ 4.3 (com Management Plugin)
  # --------------------------------------------------
  rabbitmq:
    image: rabbitmq:4.3.4-management
    container_name: rabbitmq-suasflux-prem-hml
    restart: unless-stopped
    environment:
      TZ: ${TZ:-America/Recife}
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-admin}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - suasflux-prem-hml
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

  # --------------------------------------------------
  # APACHE KAFKA 3.9 (KRaft mode)
  # --------------------------------------------------
  kafka:
    image: apache/kafka:3.9.0
    container_name: kafka-suasflux-prem-hml
    restart: unless-stopped
    environment:
      TZ: ${TZ:-America/Recife}
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-Mk3OEYBSD34fcwNTJENDM2Qk}
    ports:
      - "${KAFKA_PORT:-9092}:9092"
      - "${KAFKA_CONTROLLER_PORT:-9093}:9093"
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - suasflux-prem-hml
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '0.75'
          memory: 1.5G
        reservations:
          cpus: '0.50'
          memory: 512M

  # --------------------------------------------------
  # KAFBAT UI
  # --------------------------------------------------
  kafbat-ui:
    image: kafbat/kafka-ui:latest
    container_name: kafbat-ui-suasflux-prem-hml
    restart: unless-stopped
    environment:
      TZ: ${TZ:-America/Recife}
      KAFKA_CLUSTERS_0_NAME: suasflux-hml
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    ports:
      - "${KAFBAT_UI_PORT:-8081}:8080"
    networks:
      - suasflux-prem-hml
    depends_on:
      kafka:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

  # --------------------------------------------------
  # MINIO + CONSOLE
  # --------------------------------------------------
  minio:
    image: minio/minio:RELEASE.2025-07-26T00-00-00Z
    container_name: minio-suasflux-prem-hml
    restart: unless-stopped
    environment:
      TZ: ${TZ:-America/Recife}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - suasflux-prem-hml
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 512M

  # --------------------------------------------------
  # KEYCLOAK 26.2.4 (modo produção)
  # --------------------------------------------------
  keycloak:
    image: quay.io/keycloak/keycloak:26.2.4
    container_name: keycloak-suasflux-prem-hml
    restart: unless-stopped
    environment:
      TZ: ${TZ:-America/Recife}
      KC_DB: mysql
      KC_DB_URL: jdbc:mysql://mysql:3306/${KEYCLOAK_DB:-keycloak_db}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USERNAME:-keycloak_user}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HOSTNAME_STRICT: 'false'
      KC_HTTP_ENABLED: 'true'
    ports:
      - "${KEYCLOAK_PORT:-8080}:8080"
    command: ["start", "--optimized"]
    networks:
      - suasflux-prem-hml
      - suasflux-prem-common
    depends_on:
      mysql:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.75'
          memory: 1.5G
        reservations:
          cpus: '0.50'
          memory: 512M

  # --------------------------------------------------
  # HASHICORP VAULT
  # --------------------------------------------------
  vault:
    image: hashicorp/vault:latest
    container_name: vault-suasflux-prem-hml
    restart: unless-stopped
    environment:
      TZ: ${TZ:-America/Recife}
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_DEV_ROOT_TOKEN_ID:-SuasFlux@Vault#2026}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    ports:
      - "${VAULT_PORT:-8200}:8200"
    volumes:
      - vault_data:/vault/file
    cap_add:
      - IPC_LOCK
    command: server -dev -dev-root-token-id="${VAULT_DEV_ROOT_TOKEN_ID:-SuasFlux@Vault#2026}"
    networks:
      - suasflux-prem-hml
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

volumes:
  mysql_data:
    name: suasflux-prem-hml-mysql-data
  postgres_data:
    name: suasflux-prem-hml-postgres-data
  redis_data:
    name: suasflux-prem-hml-redis-data
  mongodb_data:
    name: suasflux-prem-hml-mongodb-data
  rabbitmq_data:
    name: suasflux-prem-hml-rabbitmq-data
  kafka_data:
    name: suasflux-prem-hml-kafka-data
  minio_data:
    name: suasflux-prem-hml-minio-data
  vault_data:
    name: suasflux-prem-hml-vault-data

networks:
  suasflux-prem-hml:
    name: suasflux-prem-hml
    driver: bridge
  suasflux-prem-common:
    name: suasflux-prem-common
    driver: bridge
    external: true
